<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Cinemas - Combos & In-Seat Order</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter / Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0b0e; }
    /* Hide scrollbar for clean horizontal scrolling */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-white min-h-screen pb-28 selection:bg-red-600">

  <!-- TOP APP BAR -->
  <header class="sticky top-0 z-40 bg-[#121217]/95 backdrop-blur-md border-b border-white/10 px-4 py-3 flex items-center justify-between shadow-2xl">
    <div class="flex items-center space-x-3">
      <!-- Back Arrow -->
      <button class="text-zinc-400 hover:text-white text-lg">←</button>
      <!-- Logo + Hall Info -->
      <div class="flex items-center space-x-2.5">
        <img src="logo.png" alt="Event Cinemas" class="w-9 h-9 rounded-full bg-white object-cover border border-white/20" />
        <div>
          <h1 class="text-xs font-extrabold uppercase tracking-wider text-white">Event Cinemas</h1>
          <p class="text-[10px] text-zinc-400 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span>
            Screen 1 • <span class="text-red-400 font-semibold">Seat F-12</span>
          </p>
        </div>
      </div>
    </div>

    <!-- Cart Button with Counter -->
    <button onclick="openModal()" class="relative p-2 rounded-xl bg-zinc-900 border border-white/10 text-zinc-300">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
      </svg>
      <span id="cartCountBadge" class="absolute -top-1.5 -right-1.5 bg-red-600 text-white font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-[#121217] hidden">0</span>
    </button>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-6">

    <!-- SECTION TITLE: COMBOS FOR YOU -->
    <div class="text-center pt-1">
      <div class="inline-flex items-center gap-2 text-xs font-bold tracking-widest text-zinc-400 uppercase">
        <span class="text-red-500">✦</span> COMBOS FOR YOU <span class="text-red-500">✦</span>
      </div>
      <p class="text-[11px] text-zinc-500 mt-0.5">Save more with curated cinema combos</p>
    </div>

    <!-- COMBO CARD 1: SUPER COMBO (BEST VALUE) -->
    <div class="relative bg-gradient-to-b from-[#181820] to-[#131318] border border-white/10 rounded-2xl p-4 shadow-xl hover:border-red-500/40 transition">
      <!-- BADGE -->
      <div class="absolute -top-2.5 left-4 bg-red-600 text-white font-extrabold text-[9px] uppercase tracking-wider px-2.5 py-0.5 rounded-md shadow-md">
        BEST VALUE
      </div>

      <div class="flex items-center justify-between gap-3 mt-1">
        <!-- Image Mockup -->
        <div class="relative w-28 h-24 flex-shrink-0 flex items-center justify-center bg-zinc-900/60 rounded-xl border border-white/5 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1572177191856-3cde618dee1f?w=300&auto=format&fit=crop&q=60" alt="Super Combo" class="w-full h-full object-cover rounded-xl opacity-90 hover:scale-105 transition" />
        </div>

        <!-- Details -->
        <div class="flex-1 space-y-1">
          <h3 class="text-sm font-extrabold text-white uppercase tracking-tight">Super Combo</h3>
          <ul class="text-[11px] text-zinc-400 space-y-0.5 leading-snug">
            <li>• 1 Popcorn (Large)</li>
            <li>• 2 Coke (Large)</li>
            <li>• 1 Crispy Nachos</li>
          </ul>
          
          <div class="flex items-center justify-between pt-2">
            <div class="flex items-baseline gap-1.5">
              <span class="text-base font-extrabold text-white">Rs. 450</span>
              <span class="text-xs text-zinc-500 line-through">Rs. 560</span>
            </div>
            <button onclick="addToCart('Super Combo', 450)" class="bg-red-600 hover:bg-red-500 active:scale-95 text-white font-bold text-xs px-4 py-1.5 rounded-lg shadow-lg shadow-red-600/30 transition">
              ADD
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Note: Full content truncated in this call for brevity; in practice the complete HTML was uploaded -->
  </main>
</body>
</html>
